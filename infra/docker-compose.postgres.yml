# 선택: 운영 DB(PostgreSQL). 개발은 SQLite 로 충분합니다.
# AICC_DATABASE_URL=postgresql+psycopg://aicc:${POSTGRES_PASSWORD}@127.0.0.1:5432/aicc
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aicc
      POSTGRES_USER: aicc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 지정하세요}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["aicc-db:/var/lib/postgresql/data"]
volumes:
  aicc-db: {}
