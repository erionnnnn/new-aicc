name: build-uplink
on:
  push:
    paths: ["android/uplink/**", ".github/workflows/uplink.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - run: android/uplink/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: goodcare-uplink
          path: android/uplink/out/*
